<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" version="1" viewBox="0 0 64 64">
 <defs>
  <clipPath id="disc"><circle cx="32" cy="32" r="30"/></clipPath>
 </defs>
 <!-- base shadow -->
 <circle style="opacity:0.2" cx="32" cy="33" r="30"/>
 <!-- rust disc -->
 <circle style="fill:#c4501f" cx="32" cy="32" r="30"/>
 <!-- weathered patina ("Mr. Rusty") -->
 <g clip-path="url(#disc)">
  <path style="fill:#8f3511;opacity:0.35" d="M2 40c6-2 10 3 17 1s9-6 16-4 10 6 17 4 8-3 10-3V62H2z"/>
  <ellipse style="fill:#e0753c;opacity:0.35" cx="18" cy="17" rx="9" ry="5" transform="rotate(-30 18 17)"/>
  <ellipse style="fill:#8f3511;opacity:0.25" cx="49" cy="46" rx="6" ry="3.5" transform="rotate(20 49 46)"/>
 </g>
 <!-- top highlight -->
 <path style="fill:#ffffff;opacity:0.2" d="M32 2A30 30 0 0 0 2 32a30 30 0 0 0 .02.6A30 30 0 0 1 32 3a30 30 0 0 1 29.98 29.4A30 30 0 0 0 62 32 30 30 0 0 0 32 2z"/>

 <!-- symbol shadow -->
 <g style="opacity:0.2" transform="translate(30,35) rotate(45)">
  <use href="#plane"/>
 </g>

 <!-- Shackleton AEW.2 planform, heading up-right -->
 <g transform="translate(30,34) rotate(45)">
  <g id="plane">
   <!-- radar sweep (airborne early warning) -->
   <path style="fill:none;stroke:#f3e3d3;stroke-width:1.8;stroke-linecap:round;opacity:0.75" d="M-7.5-18.5A20 20 0 0 1 7.5-18.5"/>
   <path style="fill:none;stroke:#f3e3d3;stroke-width:1.8;stroke-linecap:round;opacity:0.45" d="M-9.4-23.2A25 25 0 0 1 9.4-23.2"/>
   <!-- wings -->
   <path style="fill:#dcdcdc" d="M-21.2-3.2 -3-6h6l18.2 2.8c.6.1.8.5.8 1v1.4c0 .5-.3.8-.8.8L3 2.2h-6l-18.2-2.2c-.5 0-.8-.3-.8-.8v-1.4c0-.5.2-.9.8-1z"/>
   <!-- tailplane -->
   <path style="fill:#dcdcdc" d="M-8.5 12h17c.5 0 .8.3.8.8v1.6c0 .5-.3.8-.8.8h-17c-.5 0-.8-.3-.8-.8v-1.6c0-.5.3-.8.8-.8z"/>
   <!-- twin oval fins -->
   <rect style="fill:#bdbdbd" width="2" height="6" x="-9.6" y="10.6" rx="1"/>
   <rect style="fill:#bdbdbd" width="2" height="6" x="7.6" y="10.6" rx="1"/>
   <!-- fuselage -->
   <path style="fill:#f0f0f0" d="M0-17c1.8 0 2.8 1.6 2.8 4v26c0 2.4-1.2 4-2.8 4s-2.8-1.6-2.8-4v-26c0-2.4 1-4 2.8-4z"/>
   <!-- cockpit glazing -->
   <path style="fill:#4a5a66" d="M-1.6-12.6c0-1.2.7-1.9 1.6-1.9s1.6.7 1.6 1.9v1.2h-3.2z"/>
   <!-- Griffon nacelles -->
   <rect style="fill:#f0f0f0" width="2.8" height="11" x="-15" y="-9" rx="1.4"/>
   <rect style="fill:#f0f0f0" width="2.8" height="11" x="-8.2" y="-9.6" rx="1.4"/>
   <rect style="fill:#f0f0f0" width="2.8" height="11" x="5.4" y="-9.6" rx="1.4"/>
   <rect style="fill:#f0f0f0" width="2.8" height="11" x="12.2" y="-9" rx="1.4"/>
   <!-- contra-rotating props -->
   <g style="fill:#3d3d3d;opacity:0.45">
    <ellipse cx="-13.6" cy="-10" rx="3.6" ry="1.2"/>
    <ellipse cx="-6.8" cy="-10.6" rx="3.6" ry="1.2"/>
    <ellipse cx="6.8" cy="-10.6" rx="3.6" ry="1.2"/>
    <ellipse cx="13.6" cy="-10" rx="3.6" ry="1.2"/>
   </g>
   <g style="fill:#5d5d5d">
    <circle cx="-13.6" cy="-9.6" r="0.9"/>
    <circle cx="-6.8" cy="-10.2" r="0.9"/>
    <circle cx="6.8" cy="-10.2" r="0.9"/>
    <circle cx="13.6" cy="-9.6" r="0.9"/>
   </g>
   <!-- RAF roundels on the wings, toned down -->
   <circle style="fill:#4a6a8a" cx="-18" cy="-1.4" r="1.3"/>
   <circle style="fill:#b5503a" cx="-18" cy="-1.4" r="0.55"/>
   <circle style="fill:#4a6a8a" cx="18" cy="-1.4" r="1.3"/>
   <circle style="fill:#b5503a" cx="18" cy="-1.4" r="0.55"/>
  </g>
 </g>
</svg>
